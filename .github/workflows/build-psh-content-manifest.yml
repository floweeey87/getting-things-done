name: Build PSH content manifest

on:
  push:
    paths:
      - 'powerstation-helden/content-sync/ready.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          root = Path('powerstation-helden/content-sync')
          cfg = json.loads((root / 'ready.json').read_text())
          content = ''.join(p.read_text() for p in sorted((root / cfg['source_dir']).glob('part-*.html')))
          manifest = {
              'version': int(cfg['version']),
              'updates': [{
                  'slug': cfg['slug'],
                  'title': cfg['title'],
                  'excerpt': cfg['excerpt'],
                  'content_base64': base64.b64encode(content.encode()).decode(),
                  'content_sha256': hashlib.sha256(content.encode()).hexdigest(),
              }],
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')))
          PY
      - name: Commit manifest
        run: |
          git config user.name 'PSH Content Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add powerstation-helden/content-sync/manifest.json
          git diff --cached --quiet || git commit -m 'Build PSH content manifest'
          git push
