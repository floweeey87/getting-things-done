name: Uptime-Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sites prüfen
        run: python3 saas-replacements/01-uptime-monitor/check.py

      - name: Statusverlauf committen
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git add saas-replacements/01-uptime-monitor/status
          if ! git diff --cached --quiet; then
            git commit -m "Update uptime status"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Bei Ausfall Issue öffnen / bei Erholung schließen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create incident --color D93F0B --description "Automatischer Uptime-Alarm" 2>/dev/null || true

          DOWN_FILE="saas-replacements/01-uptime-monitor/status/down.json"
          python3 -c "
          import json
          for s in json.load(open('$DOWN_FILE')):
              print(f\"{s['slug']}|{s['name']}|{s['url']}|{s['error']}\")
          " > /tmp/down.txt

          # Offene Incident-Issues einsammeln
          gh issue list --label incident --state open --json title,number \
            --jq '.[] | "\(.number)|\(.title)"' > /tmp/open_issues.txt || true

          # Für jede ausgefallene Site: Issue öffnen, falls noch keins existiert
          while IFS='|' read -r slug name url error; do
            [ -z "$slug" ] && continue
            if ! grep -q "Ausfall: $slug" /tmp/open_issues.txt; then
              gh issue create \
                --title "Ausfall: $slug" \
                --label incident \
                --body "🔴 **$name** ($url) ist nicht erreichbar.

          Fehler: \`$error\`

          Dieses Issue wird automatisch geschlossen, sobald die Site wieder erreichbar ist."
            fi
          done < /tmp/down.txt

          # Erholte Sites: zugehörige Issues schließen
          while IFS='|' read -r number title; do
            [ -z "$number" ] && continue
            slug="${title#Ausfall: }"
            if ! grep -q "^$slug|" /tmp/down.txt; then
              gh issue close "$number" --comment "🟢 Wieder erreichbar. Automatisch geschlossen."
            fi
          done < /tmp/open_issues.txt
